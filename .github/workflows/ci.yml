name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一分支的新推送取消旧任务；PR 与 main 各用各的 group。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # prepare 会先跑一次 build；这里保留显式 build，让构建失败能单独定位。
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
