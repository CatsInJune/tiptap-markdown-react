name: Deploy site to Aliyun ECS

# 只支持手动触发：在 Actions 页面点 "Run workflow"，可指定要部署的
# 分支 / tag / commit。push 不会自动部署，避免未验证的代码直接上线。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要部署的分支 / tag / commit（回滚时填历史 commit）"
        required: false
        default: "main"

permissions:
  contents: read

# 同一时刻只跑一个部署，新的执行取消排队中的旧构建。
concurrency:
  group: ecs-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      REMOTE_DIR: /var/www/tiptap-markdown-react
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'main' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install library dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      # site 通过 file:.. 依赖库，必须在库构建完成之后再安装。
      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site

      - name: Compute release name
        id: rel
        run: echo "name=$(date -u +%Y%m%d%H%M%S)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # 尚未配置 secrets（ECS_HOST 为空）时只构建、不部署，避免流水线红叉。
      - name: Set up SSH key
        if: ${{ env.ECS_HOST != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts

      - name: Upload new release
        if: ${{ env.ECS_HOST != '' }}
        run: |
          REL='${{ steps.rel.outputs.name }}'
          ssh "$ECS_USER@$ECS_HOST" "mkdir -p '$REMOTE_DIR/releases/$REL'"
          rsync -avz --chmod=D755,F644 \
            site/dist/ "$ECS_USER@$ECS_HOST:$REMOTE_DIR/releases/$REL/"
          rsync -avz deploy/rollback.sh "$ECS_USER@$ECS_HOST:$REMOTE_DIR/rollback.sh"

      # nginx.conf 以仓库为唯一来源；current 软链切流量；
      # 只保留最近 5 个版本目录。nginx 未就绪时跳过 reload，不中断流程。
      - name: Switch traffic to new release
        if: ${{ env.ECS_HOST != '' }}
        run: |
          REL='${{ steps.rel.outputs.name }}'
          ssh "$ECS_USER@$ECS_HOST" "
            ln -sfn '$REMOTE_DIR/releases/$REL' '$REMOTE_DIR/current' &&
            (nginx -t && systemctl reload nginx) || echo 'nginx not ready, skipped reload'
            cd '$REMOTE_DIR/releases' && ls -1d */ | sort -r | tail -n +6 | xargs -r rm -rf
          "
          echo "==> 已发布版本 $REL（保留最近 5 个，可 ssh 登录后 bash $REMOTE_DIR/rollback.sh prev 回滚）"
