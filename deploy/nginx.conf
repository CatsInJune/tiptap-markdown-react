# tiptap-markdown-react 站点 nginx 配置
# 放到 /etc/nginx/conf.d/tiptap-markdown-react.conf（或 sites-available 后软链到 sites-enabled）
# 改完执行：nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # "_" 表示匹配任意主机名（用 IP 直接访问即可打开）。
    # 绑定域名后改成你的域名（如 example.com www.example.com），push 即生效。
    server_name _;

    # current 是软链，每次部署/回滚都会切换其指向，版本切换无需改 nginx 配置。
    root /var/www/tiptap-markdown-react/current;
    index index.html;

    charset utf-8;

    # 带内容 hash 的构建产物，可以放心长缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 入口文件不缓存，保证发版后用户立刻拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 单页应用兜底：当前站点没有前端路由，但以后加了刷新子路径不会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 文本资源压缩（woff2 本身已压缩，不用再 gzip）
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # 静态站点没有上传需求，关掉
    client_max_body_size 1m;
}
